claims:
- id: combined-figure1-preserves-inputs
  statement: 'The combined ROOT plot preserves every input graph''s coordinates and
    color. cFig1 curves use solid lines; digitized curves use dotted lines with PARK
    labels.

    '
  evidence:
  - work/combine_figure1/check.C::check
  - work/combine_figure1/check.log
  numbers:
  - combined-graph-count
figures:
- file: combined_figure1.png
  produced_by: combined_figure1.C::combined_figure1
  shows: 'Dark-photon differential production spectrum versus energy, overlaying the
    supplied cFig1 and digitized PARK curves. This is a graphical combination, not
    an independent physics calculation or validation of the digitization.

    '
  from_scratch: 'Common frame, graph names, line styles and legend. Coordinate vectors
    and colors copied from cFig1.C and park_figure1_digitized.C.

    '
  from_library: ROOT TGraph, TCanvas, TH1F, TLegend and PDF/PNG rendering.
  choices:
  - Standalone macro with embedded original data, generated by work/combine_figure1/build.py.
  - Preserve disconnected digitized segments; no interpolation, smoothing or rescaling.
  - Preserve each source color, including black PARK and cyan cFig1 for the largest
    mass.
  - ROOT line style 1 for cFig1 and 3 for PARK, with line width 2.
  - Logarithmic ordinate; x range 0 to 4.3 MeV from PARK and y range 0.0001 to 5 from
    cFig1.
  - Legend entries reference graph pointers; label each source explicitly.
  supports:
  - combined-figure1-preserves-inputs
- file: combined_figure1.pdf
  produced_by: combined_figure1.C::combined_figure1
  shows: Same combined spectrum as combined_figure1.png, exported as PDF.
  from_scratch: Same graph composition as the PNG; no new physics calculation.
  from_library: ROOT PDF rendering.
  choices:
  - Vector PDF export of the same canvas.
  supports:
  - combined-figure1-preserves-inputs
