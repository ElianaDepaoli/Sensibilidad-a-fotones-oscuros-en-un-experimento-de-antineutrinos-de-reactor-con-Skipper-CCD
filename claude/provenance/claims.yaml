      Total production cross section per electron (eps=1) vs photon energy for M = 0, 0.1, 0.5, 1 MeV, exact
      (solid) and note 1's integrand integrated over the exact range (dashed); the M=0 curve is Klein-Nishina.
    from_scratch: exact dsigma/dx and quadrature over [x_-, x_+]
    from_library: scipy.integrate.quad, matplotlib
