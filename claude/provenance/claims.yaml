    shows: >
      eps^-2 dsigma/dE_A' at E_gamma = 3 MeV for M = 0.1, 0.5, 1 MeV: exact (black) vs the note's eq (50) (red
      dashed) over the range the note claims; grey bands mark the region outside the exact [x_-, x_+]. The note
      agrees with the exact curve only for M=0.1 MeV away from the edges; at M=1 MeV it has a pole inside its range.
    from_scratch: exact kinematics, exact F, transcription of the note's formula
    from_library: numpy, matplotlib, (hbar c)^2 conversion constant
