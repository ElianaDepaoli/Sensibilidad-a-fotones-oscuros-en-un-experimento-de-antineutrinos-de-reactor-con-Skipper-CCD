claims:
- id: darkphoton-v3-redo
  statement: >
    The corrected ROOT run passes independent cross-section and bounded event-limit checks;
    every exported curve has finite visible points and survives until canvas export.
    The figures compare published source data with independent predictions and do not
    establish complete numerical reproduction of Park or Danilov.
  evidence:
  - code/darkphoton_v3/redo.cpp::Checks,CheckGraph,Save,Figure1,Limits
  - code/darkphoton_v3/output/run_receipt.txt
  - code/darkphoton_v3/output/danilov_digitized.csv
  - papers/darkphoton_v3/danilov2019.pdf::Eqs.5,6,9 and Fig.1
  numbers: [v3_redo_limits, v3_redo_inputs, v3_redo_domains]
