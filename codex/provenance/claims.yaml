claims:
- id: park-production-v2-provenance
  statement: The fresh ROOT/C++ production calculation derives and checks the dark-photon
    Compton-like cross section, compares the TEXONO source spectra with Park Figure
    1, and records the remaining reproduction failure.
  evidence:
  - code/park_production_v2/production.cpp::Checks
  - code/park_production_v2/reports.cpp::Provenance
  - code/park_production_v2/output/run_receipt.txt
  - report_park_production_v2_agent.html
  numbers: []
- id: darkphoton-v3-redo
  statement: 'The corrected ROOT run passes independent cross-section and bounded
    event-limit checks; every exported curve has finite visible points and survives
    until canvas export. The figures compare published source data with independent
    predictions and do not establish complete numerical reproduction of Park or Danilov.

    '
  evidence:
  - code/darkphoton_v3/redo.cpp::Checks,CheckGraph,Save,Figure1,Limits
  - code/darkphoton_v3/output/run_receipt.txt
  - code/darkphoton_v3/output/danilov_digitized.csv
  - papers/darkphoton_v3/danilov2019.pdf::Eqs.5,6,9 and Fig.1
  numbers:
  - v3_redo_limits
  - v3_redo_inputs
  - v3_redo_domains
- id: conventional-channel
  statement: 'Conventional reactor searches produce visible kinetically mixed dark
    photons from MeV photons and detect them through inverse Compton-like scattering;
    the simplest event rate scales approximately as epsilon to the fourth power.

    '
  evidence:
  - papers_reactor_dark_photon/01_park_2017.pdf::Eqs. 1-7
  - papers_reactor_dark_photon/02_danilov_demidov_gorbunov_2019.pdf::Eqs. 1-9
  numbers:
  - visible_rate_epsilon_power
  - reactor_gamma_min_mev
  - reactor_gamma_max_mev
- id: park-limits-disputed
  statement: 'Park reported sub-MeV NEOS and TEXONO limits, but the later oscillation
    and efficiency reanalysis found the NEOS treatment too optimistic and reactor
    sensitivity suppressed below about 0.1 eV.

    '
  evidence:
  - papers_reactor_dark_photon/01_park_2017.pdf::NEOS and TEXONO analysis
  - papers_reactor_dark_photon/02_danilov_demidov_gorbunov_2019.pdf::discussion and
    conclusion
  numbers:
  - park_mass_max_mev
  - park_neos_epsilon
  - park_texono_epsilon
  - neos_window_low_mev
  - neos_window_high_mev
  - texono_window_low_mev
  - texono_window_high_mev
  - danss_projection_epsilon
  - dgg_low_mass_eV
  - confidence_standard_percent
- id: portal-distinct
  statement: 'The CONUS, MINER, RENO, and NEOS dark-axion-portal projections constrain
    a different coupling plane and must not be merged with epsilon-only kinetic-mixing
    limits.

    '
  evidence:
  - papers_reactor_dark_photon/03_deniverville_lee_lee_2021.pdf::Table I and Fig.
    4
  numbers:
  - portal_neos_cut_mev
  - confidence_standard_percent
- id: tao-systematics
  statement: 'The JUNO-TAO projection is background-systematics limited and reports
    weaker baseline sensitivity than the disputed NEOS projection.

    '
  evidence:
  - papers_reactor_dark_photon/04_smirnov_et_al_2022.pdf::Section V and Figs. 3-4
  numbers:
  - tao_window_low_mev
  - tao_window_high_mev
  - tao_days
  - tao_background_systematic_percent
  - tao_coupling_sensitivity
  - tao_optimization_factor
  - confidence_standard_percent
- id: scattering-dispute
  statement: 'The large multiple-scattering enhancement claimed in 2024 is disputed
    by a 2025 GEANT-based analysis, which finds a smaller energy-dependent enhancement
    and a mixing-limit correction below 30 percent.

    '
  evidence:
  - papers_reactor_dark_photon/05_du_liu_wang_wu_2024.pdf::Sections VI-VIII
  - papers_reactor_dark_photon/07_demidov_gorbunov_polonski_2025.pdf::abstract and
    Section 5
  numbers:
  - du_production_factor
  - pcge_window_low_kev
  - pcge_window_high_kev
  - rebuttal_enhancement_high_energy
  - rebuttal_high_energy_mev
  - rebuttal_enhancement_low_energy
  - rebuttal_low_energy_mev
  - rebuttal_limit_change_percent
- id: neon-direct-search
  statement: 'NEON directly compared reactor-on and reactor-off keV spectra and found
    no light-dark-matter signal in an invisible-dark-photon-decay model.

    '
  evidence:
  - papers_reactor_dark_photon/06_neon_2025.pdf::abstract, analysis, and Fig. 3
  numbers:
  - neon_roi_low_kev
  - neon_roi_high_kev
  - neon_dm_mass_low_kev
  - neon_dm_mass_high_kev
  - neon_sigma_e_cm2
  - neon_benchmark_mass_kev
  - neon_mass_ratio
  - confidence_neon_percent
- id: deexcitation-extension
  statement: 'The 2026 TEXONO recast uses neutron-capture de-excitation lines to extend
    the claimed visible-dark-photon mass reach beyond conventional Compton-like production.

    '
  evidence:
  - papers_reactor_dark_photon/08_lou_wu_2026.pdf::Table I and Sections IV-V
  numbers:
  - deexcitation_mass_low_mev
  - deexcitation_mass_high_mev
  - line_u238_low_mev
  - line_u238_high_mev
  - line_b10_low_mev
  - line_b10_high_mev
  - texono_window_low_mev
  - texono_window_high_mev
  - confidence_standard_percent
