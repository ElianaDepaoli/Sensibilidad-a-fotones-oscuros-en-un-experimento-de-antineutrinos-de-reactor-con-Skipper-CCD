  statement: The original Figure 1 vector paths were extracted and compared without
    normalization fitting. The full finite-mass figure fails the selected local residual
    criterion; only the low-mass central interval passes.
  evidence:
  - code/park_texono/inspect_sources.py::extract_figure1
  - code/park_texono/park_texono.cpp::CompareFigure1
  - code/park_texono/output/figure1_status.json
